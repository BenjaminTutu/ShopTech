{% block style %}
{{ bootstrap.load_css() }}
<link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
{% endblock %}



{% block content %}
<div class="container">
    <div class="row">
        <div class="col-md-12">
            <div class="page-header">
                <h1 style="text-align: center; color: #00bf63; margin: 10px auto;">Dashboard</h1>
                <hr
                    style="border: none; height: 5px; width: 80px; margin: 10px auto; background: #00bf63; margin-bottom: 20px;">
                <table class="table table-dark">
                    <thead>
                        <tr>
                            <th> Customers</th>
                            <th> Stock</th>
                            <th> Order</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr>
                            <td><a class="btn" href="{{ url_for('admins.view_customers') }}">View Customer</a></td>
                            <td><a class="btn" href="{{ url_for('admins.shop_items') }}">View Shop Items</a></td>
                            <td><a href="#" class="btn">Order History</a></td>
                        </tr>
                    </tbody>
                </table>

            </div>
        </div>
    </div>
</div>
{% endblock %}



{% block script %}
{{ bootstrap.load_js() }}
{% endblock %}
