{% extends 'base.html' %}

{% block content %}

<div class="container">
    <div class="card-grid">
        {% for product in products %}
        
        <div class="card product-card h-100">

            <!-- Clickable product -->
            <a href="{{ url_for('cart.product_detail', product_id=product.id) }}">
                <img src="{{ url_for('static', filename='images/products/'+ product.image) }}" 
                     class="card-img-top">

                <div class="card-body d-flex flex-column">
                    <p class="card-title">{{ product.name }}</p>

                    <p style="color: gold;">
                        {% for i in range(1, 6) %}
                            {% if i <= product.rating %}
                                <i class="bi bi-star-fill"></i>
                            {% else %}
                                <i class="bi bi-star"></i>
                            {% endif %}
                        {% endfor %}
                    </p>

                    <strong>
                        <p class="card-text">Ghs {{ product.price }}</p>
                    </strong>

                    <strike style="color: gray;">
                        <small>Ghs {{ product.previous_price }}</small>
                    </strike>
                </div>
            </a>

            <!-- Hover button -->
            <a href="{{ url_for('cart.add_cart', product_id=product.id) }}" 
               class="btn btn-success add-btn">
               Add to Cart
            </a>

        </div>

        {% endfor %}
    </div>
</div>

{% endblock %}
